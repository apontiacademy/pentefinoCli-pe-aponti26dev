[project]
name = "pentefinocli-pe-aponti26dev"
version = "0.1.0"
description = "Geração de análise de execução de relatórios da Aponti Academy."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.3",
]

[project.scripts]
pentefino = "pentefino.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pentefino"]